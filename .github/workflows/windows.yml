name: Windows fixture checks
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build and run isolated native tests
        shell: pwsh
        run: ./scripts/build.ps1
      - name: Render demo screenshots
        timeout-minutes: 4
        shell: pwsh
        run: |
          $exe = (Resolve-Path dist/win-x64/StillCodexSwitcher.exe).Path
          $p = Start-Process $exe -ArgumentList '--render',"$pwd/dist/light.png",'--render-accounts' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw 'Light render failed' }
          $p = Start-Process $exe -ArgumentList '--render',"$pwd/dist/dark.png",'--dark','--render-accounts' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw 'Dark render failed' }
          foreach ($case in @('light','dark','empty','compact','details','dark-details')) {
            $arguments = @('--render',"$pwd/dist/tokens-$case.png",'--render-tokens')
            if ($case -like 'dark*') { $arguments += '--dark' }
            if ($case -like '*details') { $arguments += '--tokens-bottom' }
            if ($case -eq 'empty') { $arguments += '--tokens-empty' }
            if ($case -eq 'compact') { $arguments += '--compact' }
            $p = Start-Process $exe -ArgumentList $arguments -Wait -PassThru
            if ($p.ExitCode -ne 0) { throw "Token $case render/UI tests failed" }
          }
          foreach ($case in @('light','dark','compact','details')) {
            $arguments = @('--render',"$pwd/dist/warmup-$case.png",'--render-warmup')
            if ($case -eq 'dark') { $arguments += '--dark' }
            if ($case -eq 'details') { $arguments += '--warmup-bottom' }
            if ($case -eq 'compact') { $arguments += '--compact' }
            $p = Start-Process $exe -ArgumentList $arguments -Wait -PassThru
            if ($p.ExitCode -ne 0) { throw "Warmup $case render/UI tests failed" }
          }
          'PASS native warmup UI: default OFF, independent toggle, paused/success/next-time states, manual demo sends no request; four renders' | Set-Content dist/warmup-ui-tests.txt
          $p = Start-Process $exe -ArgumentList '--render',"$pwd/dist/settings-light.png",'--render-settings' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw 'Settings/sidebar alignment render failed' }
          foreach ($case in @('light','dark','compact','empty','details')) {
            $arguments = @('--render',"$pwd/dist/diagnostics-$case.png",'--render-diagnostics')
            if ($case -eq 'dark') { $arguments += '--dark' }
            if ($case -eq 'compact') { $arguments += '--compact' }
            if ($case -eq 'empty') { $arguments += '--diagnostics-empty' }
            if ($case -eq 'details') { $arguments += '--diagnostics-bottom' }
            $p = Start-Process $exe -ArgumentList $arguments -Wait -PassThru
            if ($p.ExitCode -ne 0) { throw "Diagnostics $case render/UI tests failed" }
          }
          'PASS native diagnostics UI: result, exhausted and unknown states; no live account or inference request; five renders' | Set-Content dist/diagnostics-ui-tests.txt
          foreach ($case in @('light','dark','compact','pending')) {
            $arguments = @('--render',"$pwd/dist/reset-cards-$case.png",'--render-accounts','--render-reset-cards')
            if ($case -eq 'dark') { $arguments += '--dark' }
            if ($case -eq 'compact') { $arguments += '--compact' }
            if ($case -eq 'pending') { $arguments += '--reset-pending' }
            $p = Start-Process $exe -ArgumentList $arguments -Wait -PassThru
            if ($p.ExitCode -ne 0) { throw "Reset card $case render/UI tests failed" }
          }
          'PASS native reset-card UI: balance, expiry, zero/unknown disabled, pending retry, busy disables all; four renders, synthetic only' | Set-Content dist/reset-cards-ui-tests.txt
          $navReports = @(Get-ChildItem dist/*.nav.json)
          if ($navReports.Count -ne 22) { throw 'Missing navigation geometry reports' }
          foreach ($report in $navReports) {
            $geometry = Get-Content $report.FullName | ConvertFrom-Json
            if (-not $geometry.passed) { throw 'Sidebar geometry check failed' }
          }
          'PASS sidebar geometry: four labels share left edge, account count stays right; 22 renders across selected pages, light/dark and compact views' | Set-Content dist/sidebar-ui-tests.txt
          $normal = Get-Content dist/tokens-light.png.json | ConvertFrom-Json
          $compact = Get-Content dist/tokens-compact.png.json | ConvertFrom-Json
          if ($compact.width -ge $normal.width -or $compact.height -ge $normal.height) { throw 'Compact viewport not reduced' }
          'PASS native Token UI: Today/Week/Month selection, golden totals, export readiness, empty state; six renders, compact dimensions and details scroll' | Set-Content dist/token-ui-tests.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Windows-build-and-fixture-results
          path: windows/dist/
