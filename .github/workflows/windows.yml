name: Windows fixture checks
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build and run isolated native tests
        shell: pwsh
        run: ./scripts/build.ps1
      - name: Render demo screenshots
        timeout-minutes: 2
        shell: pwsh
        run: |
          $exe = (Resolve-Path dist/win-x64/StillCodexSwitcher.exe).Path
          $p = Start-Process $exe -ArgumentList '--render',"$pwd/dist/light.png",'--render-accounts' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw 'Light render failed' }
          $p = Start-Process $exe -ArgumentList '--render',"$pwd/dist/dark.png",'--dark','--render-accounts' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw 'Dark render failed' }
          foreach ($case in @('light','dark','empty','compact')) {
            $arguments = @('--render',"$pwd/dist/tokens-$case.png",'--render-tokens')
            if ($case -eq 'dark') { $arguments += '--dark' }
            if ($case -eq 'empty') { $arguments += '--tokens-empty' }
            if ($case -eq 'compact') { $arguments += '--compact' }
            $p = Start-Process $exe -ArgumentList $arguments -Wait -PassThru
            if ($p.ExitCode -ne 0) { throw "Token $case render/UI tests failed" }
          }
          'PASS native Token UI: Today/Week/Month selection, golden totals, export readiness, empty state; four renders' | Set-Content dist/token-ui-tests.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Windows-build-and-fixture-results
          path: windows/dist/
